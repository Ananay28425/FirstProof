[project]
name = "firstproof"
version = "0.1.0"
description = "Evidence-driven release verification for Flagsmith"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.18,<1", "flagsmith>=6.3.0,<7", "alembic>=1.13,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "bandit>=1.8,<2", "pip-audit>=2.7,<3", "hypothesis>=6.100,<7"]
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["firstproof*"]
[tool.setuptools.package-data]
firstproof = ["templates/*.html", "static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
